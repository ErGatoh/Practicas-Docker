spring.application.name=inventario

# Valores para ejecutar en el equipo de desarrollo (IDE).
# En Docker se sustituyen con variables de entorno: SPRING_DATASOURCE_URL, etc.
spring.datasource.url=jdbc:postgresql://localhost:5432/inventario
spring.datasource.username=inventario
spring.datasource.password=cambiame

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Actuator: solo se publica el estado de salud, para el healthcheck del contenedor
management.endpoints.web.exposure.include=health
